aid: upstart
name: Upstart
description: >-
  Upstart is an AI lending marketplace (NASDAQ: UPST) that connects consumers
  with banks and credit unions, using AI-driven underwriting models to price
  credit beyond traditional FICO-based scoring. The marketplace offers personal
  loans, car loan refinancing, debt consolidation, home equity lines of credit,
  and short-term relief loans - loans are originated by regulated bank and
  credit-union partners, including lender-branded powered-by-Upstart sites.
  Upstart's API surface is partner-facing rather than public: a Reporting API
  for lending partners is operated at api.upstart.com and publicly tracked on
  status.upstart.com, but no public developer portal or API documentation is
  published.
